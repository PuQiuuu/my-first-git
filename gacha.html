<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>幻域抽卡 · Gacha Game</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --bg-dark: #0a0a1a;
    --bg-mid: #14142b;
    --accent: #6366f1;
    --gold: #fbbf24;
    --rainbow: linear-gradient(45deg, #ff0080, #ff8c00, #ffd700, #00ff88, #00bfff, #8a2be2, #ff0080);
  }

  body {
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg-dark);
    color: #fff;
    min-height: 100vh;
    overflow-x: hidden;
    background-image:
      radial-gradient(circle at 20% 20%, rgba(99, 102, 241, 0.15), transparent 40%),
      radial-gradient(circle at 80% 80%, rgba(139, 92, 246, 0.15), transparent 40%);
  }

  /* 顶部状态栏 */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 24px;
    background: rgba(20, 20, 43, 0.8);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo {
    font-size: 22px;
    font-weight: 800;
    background: var(--rainbow);
    background-size: 200% auto;
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    animation: shine 3s linear infinite;
  }
  @keyframes shine { to { background-position: 200% center; } }

  .stats { display: flex; gap: 16px; align-items: center; }
  .stat-item {
    display: flex; align-items: center; gap: 8px;
    background: rgba(255,255,255,0.06);
    padding: 8px 16px;
    border-radius: 20px;
    font-size: 14px;
  }
  .stat-icon { font-size: 18px; }
  .stat-value { font-weight: 700; color: var(--gold); }

  .btn-reset {
    background: transparent;
    border: 1px solid rgba(255,255,255,0.2);
    color: #aaa;
    padding: 8px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    transition: all 0.2s;
  }
  .btn-reset:hover { background: rgba(255,255,255,0.1); color: #fff; }

  /* 主区域 */
  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px;
  }

  .hero {
    text-align: center;
    padding: 40px 20px 20px;
  }
  .hero h1 {
    font-size: 36px;
    margin-bottom: 8px;
    background: linear-gradient(135deg, #a78bfa, #60a5fa);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .hero p { color: #8b8ba7; font-size: 15px; }

  /* 概率展示 */
  .rate-bar {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 20px 0;
    flex-wrap: wrap;
  }
  .rate-pill {
    padding: 6px 14px;
    border-radius: 12px;
    font-size: 12px;
    font-weight: 600;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .rate-ur { background: linear-gradient(135deg, #ff0080, #8a2be2); }
  .rate-ssr { background: linear-gradient(135deg, #f59e0b, #d97706); color: #1a1a1a; }
  .rate-sr { background: linear-gradient(135deg, #a855f7, #7c3aed); }
  .rate-r { background: linear-gradient(135deg, #3b82f6, #2563eb); }
  .rate-n { background: linear-gradient(135deg, #6b7280, #4b5563); }

  /* 抽卡按钮区 */
  .summon-area {
    display: flex;
    justify-content: center;
    gap: 20px;
    margin: 30px 0;
    flex-wrap: wrap;
  }
  .summon-btn {
    padding: 18px 40px;
    border: none;
    border-radius: 16px;
    font-size: 18px;
    font-weight: 700;
    cursor: pointer;
    color: #fff;
    position: relative;
    overflow: hidden;
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .summon-btn:hover { transform: translateY(-2px); }
  .summon-btn:active { transform: translateY(0); }
  .summon-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  .btn-single {
    background: linear-gradient(135deg, #6366f1, #8b5cf6);
    box-shadow: 0 8px 24px rgba(99,102,241,0.4);
  }
  .btn-ten {
    background: linear-gradient(135deg, #f59e0b, #ef4444);
    box-shadow: 0 8px 24px rgba(245,158,11,0.4);
  }
  .summon-btn .cost {
    display: block;
    font-size: 12px;
    font-weight: 400;
    opacity: 0.85;
    margin-top: 4px;
  }

  .guarantee-info {
    text-align: center;
    color: #8b8ba7;
    font-size: 13px;
    margin-bottom: 20px;
  }
  .guarantee-info span { color: var(--gold); font-weight: 600; }

  /* 标签页 */
  .tabs {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 20px;
  }
  .tab {
    padding: 10px 24px;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    color: #aaa;
    transition: all 0.2s;
  }
  .tab.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  /* 图鉴区 */
  .collection {
    background: rgba(20,20,43,0.6);
    border-radius: 16px;
    padding: 24px;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .collection-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .collection-header h2 { font-size: 18px; }
  .collection-count { color: #8b8ba7; font-size: 13px; }
  .collection-count b { color: var(--gold); }

  .filter-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .filter-chip {
    padding: 5px 14px;
    border-radius: 14px;
    font-size: 12px;
    cursor: pointer;
    background: rgba(255,255,255,0.06);
    border: 1px solid rgba(255,255,255,0.1);
    color: #aaa;
  }
  .filter-chip.active { background: rgba(255,255,255,0.15); color: #fff; }

  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 12px;
  }
  .mini-card {
    aspect-ratio: 3/4;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 8px;
    position: relative;
    overflow: hidden;
    border: 2px solid;
    transition: transform 0.2s;
    cursor: pointer;
  }
  .mini-card:hover { transform: scale(1.05); }
  .mini-card.locked {
    filter: grayscale(1) brightness(0.3);
    border-color: rgba(255,255,255,0.1);
  }
  .mini-card .icon { font-size: 32px; margin-bottom: 6px; }
  .mini-card .name { font-size: 12px; font-weight: 600; text-align: center; }
  .mini-card .count-badge {
    position: absolute;
    top: 4px;
    right: 4px;
    background: rgba(0,0,0,0.6);
    color: var(--gold);
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 8px;
    font-weight: 700;
  }
  .mini-card .rarity-stars {
    position: absolute;
    bottom: 4px;
    font-size: 10px;
    letter-spacing: 1px;
  }

  /* 抽卡结果弹窗 */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    backdrop-filter: blur(8px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
  }
  .modal-overlay.show { display: flex; }

  .results-container {
    display: grid;
    gap: 16px;
    width: 100%;
    max-width: 900px;
  }
  .results-container.single {
    grid-template-columns: 1fr;
    max-width: 280px;
  }
  .results-container.ten {
    grid-template-columns: repeat(5, 1fr);
  }
  @media (max-width: 700px) {
    .results-container.ten { grid-template-columns: repeat(2, 1fr); }
  }

  .result-card {
    aspect-ratio: 3/4;
    border-radius: 14px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px;
    position: relative;
    overflow: hidden;
    border: 3px solid;
    transform: scale(0) rotateY(180deg);
    animation: cardReveal 0.6s forwards;
  }
  @keyframes cardReveal {
    0% { transform: scale(0) rotateY(180deg); }
    60% { transform: scale(1.1) rotateY(0); }
    100% { transform: scale(1) rotateY(0); }
  }
  .result-card .icon { font-size: 48px; margin-bottom: 8px; }
  .result-card .name { font-size: 14px; font-weight: 700; text-align: center; }
  .result-card .stars { font-size: 12px; margin-top: 4px; }
  .result-card .rarity-label {
    position: absolute;
    top: 6px;
    left: 6px;
    font-size: 10px;
    font-weight: 800;
    padding: 2px 8px;
    border-radius: 6px;
    background: rgba(0,0,0,0.5);
  }

  .result-card.ur {
    background: var(--rainbow);
    background-size: 300% 300%;
    animation: cardReveal 0.6s forwards, rainbowMove 3s linear infinite;
    box-shadow: 0 0 40px rgba(255,0,128,0.6);
  }
  @keyframes rainbowMove {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }
  .result-card.ssr { background: linear-gradient(135deg, #fbbf24, #f59e0b); box-shadow: 0 0 30px rgba(251,191,36,0.5); color: #1a1a1a; }
  .result-card.sr { background: linear-gradient(135deg, #c084fc, #a855f7); }
  .result-card.r { background: linear-gradient(135deg, #60a5fa, #3b82f6); }
  .result-card.n { background: linear-gradient(135deg, #9ca3af, #6b7280); }

  /* 单抽大卡特殊样式 */
  .results-container.single .result-card { padding: 24px; }
  .results-container.single .result-card .icon { font-size: 80px; }
  .results-container.single .result-card .name { font-size: 20px; }
  .results-container.single .result-card .stars { font-size: 16px; }

  /* 抽卡光束动画 */
  .beam {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 999;
    display: none;
  }
  .beam.show { display: block; }
  .beam::before {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 10px; height: 10px;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 60px 40px rgba(255,255,255,0.8);
    animation: beamExpand 0.8s ease-out;
  }
  @keyframes beamExpand {
    0% { transform: translate(-50%,-50%) scale(0); opacity: 1; }
    100% { transform: translate(-50%,-50%) scale(60); opacity: 0; }
  }

  .modal-close {
    margin-top: 20px;
    padding: 12px 40px;
    background: rgba(255,255,255,0.1);
    border: 1px solid rgba(255,255,255,0.2);
    color: #fff;
    border-radius: 10px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 600;
    align-self: center;
    transition: background 0.2s;
  }
  .modal-close:hover { background: rgba(255,255,255,0.2); }

  /* 稀有度颜色 */
  .rarity-ur { border-color: #ff0080; }
  .rarity-ssr { border-color: #fbbf24; }
  .rarity-sr { border-color: #a855f7; }
  .rarity-r { border-color: #3b82f6; }
  .rarity-n { border-color: #6b7280; }

  /* 历史记录 */
  .history {
    background: rgba(20,20,43,0.6);
    border-radius: 16px;
    padding: 24px;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .history h2 { font-size: 18px; margin-bottom: 16px; }
  .history-list {
    max-height: 400px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .history-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    background: rgba(255,255,255,0.04);
    border-radius: 10px;
    border-left: 3px solid;
  }
  .history-item .h-icon { font-size: 24px; }
  .history-item .h-name { flex: 1; font-size: 14px; font-weight: 600; }
  .history-item .h-time { color: #8b8ba7; font-size: 12px; }
  .history-item .h-rarity { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 6px; }

  .empty-state {
    text-align: center;
    color: #8b8ba7;
    padding: 40px 20px;
    font-size: 14px;
  }

  /* 闪光特效 */
  .sparkle {
    position: absolute;
    width: 4px; height: 4px;
    background: #fff;
    border-radius: 50%;
    pointer-events: none;
    animation: sparkle 1.5s linear infinite;
  }
  @keyframes sparkle {
    0%, 100% { opacity: 0; transform: scale(0); }
    50% { opacity: 1; transform: scale(1); }
  }

  /* 获得新卡提示 */
  .new-badge {
    position: absolute;
    top: -4px; right: -4px;
    background: #ef4444;
    color: #fff;
    font-size: 10px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 8px;
    z-index: 10;
  }

  /* 模态框内容布局 */
  .modal-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
  }

  /* 浮动粒子背景 */
  .particle {
    position: fixed;
    width: 3px; height: 3px;
    background: rgba(167,139,250,0.5);
    border-radius: 50%;
    pointer-events: none;
    animation: float linear infinite;
  }
  @keyframes float {
    from { transform: translateY(100vh); }
    to { transform: translateY(-10px); }
  }

  /* 滚动条美化 */
  ::-webkit-scrollbar { width: 8px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 4px; }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">✦ 幻域抽卡 ✦</div>
  <div class="stats">
    <div class="stat-item">
      <span class="stat-icon">🎫</span>
      <span>抽卡券</span>
      <span class="stat-value" id="tickets">100</span>
    </div>
    <div class="stat-item">
      <span class="stat-icon">💎</span>
      <span>原石</span>
      <span class="stat-value" id="primogems">16000</span>
    </div>
    <button class="btn-reset" onclick="resetGame()">重置存档</button>
  </div>
</div>

<div class="container">
  <div class="hero">
    <h1>召唤你的命运</h1>
    <p>在幻域中寻找属于你的传奇角色</p>
  </div>

  <div class="rate-bar">
    <div class="rate-pill rate-ur">UR 1%</div>
    <div class="rate-pill rate-ssr">SSR 6%</div>
    <div class="rate-pill rate-sr">SR 13%</div>
    <div class="rate-pill rate-r">R 30%</div>
    <div class="rate-pill rate-n">N 50%</div>
  </div>

  <div class="guarantee-info">
    💫 十连必出 <span>SR</span> 及以上 · 每 <span id="pity-count">80</span> 抽保底 <span>UR</span>
    （当前已累计 <span id="current-pity">0</span> 抽未出 UR）
  </div>

  <div class="summon-area">
    <button class="summon-btn btn-single" onclick="summon(1)">
      单抽
      <span class="cost">消耗 1 张抽卡券</span>
    </button>
    <button class="summon-btn btn-ten" onclick="summon(10)">
      十连抽
      <span class="cost">消耗 10 张抽卡券 · 保底 SR+</span>
    </button>
    <button class="summon-btn" style="background:linear-gradient(135deg,#10b981,#059669);box-shadow:0 8px 24px rgba(16,185,129,0.4);" onclick="buyTickets()">
      购买抽卡券
      <span class="cost">160 原石 = 1 张</span>
    </button>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="collection">📚 图鉴</div>
    <div class="tab" data-tab="history">📜 抽卡记录</div>
  </div>

  <!-- 图鉴 -->
  <div class="tab-content" id="tab-collection">
    <div class="collection">
      <div class="collection-header">
        <h2>角色图鉴</h2>
        <div class="collection-count">已收集 <b id="collected-count">0</b> / <span id="total-count">0</span></div>
      </div>
      <div class="filter-bar">
        <div class="filter-chip active" data-filter="all">全部</div>
        <div class="filter-chip" data-filter="ur">UR</div>
        <div class="filter-chip" data-filter="ssr">SSR</div>
        <div class="filter-chip" data-filter="sr">SR</div>
        <div class="filter-chip" data-filter="r">R</div>
        <div class="filter-chip" data-filter="n">N</div>
      </div>
      <div class="card-grid" id="card-grid"></div>
    </div>
  </div>

  <!-- 历史 -->
  <div class="tab-content" id="tab-history" style="display:none;">
    <div class="history">
      <h2>抽卡记录</h2>
      <div class="history-list" id="history-list"></div>
    </div>
  </div>
</div>

<!-- 抽卡光束 -->
<div class="beam" id="beam"></div>

<!-- 结果弹窗 -->
<div class="modal-overlay" id="result-modal">
  <div class="modal-inner">
    <div class="results-container" id="results-container"></div>
    <button class="modal-close" onclick="closeModal()">确认</button>
  </div>
</div>

<script>

    { name: '渔夫', icon: '🎣', desc: '以海为生的渔民' },
    { name: '信使', icon: '✉️', desc: '传递消息的飞毛腿' },
    { name: '学徒厨师', icon: '🍳', desc: '梦想成为大厨' },
    { name: '矿工', icon: '⛏️', desc: '在地下挖掘宝藏' },
    { name: '船夫', icon: '⛵', desc: '摆渡江河的老船工' },
  ],
  n: [
    { name: '史莱姆', icon: '🟢', desc: '最弱的小怪' },
    { name: '哥布林', icon: '👺', desc: '狡猾的小型魔物' },
    { name: '蝙蝠', icon: '🦇', desc: '洞穴中的飞行生物' },
    { name: '蜘蛛', icon: '🕷️', desc: '织网的八脚怪物' },
    { name: '野狼', icon: '🐺', desc: '森林中的掠食者' },
    { name: '骷髅兵', icon: '💀', desc: '不死的骸骨战士' },
    { name: '僵尸', icon: '🧟', desc: '行动迟缓的不死者' },
    { name: '老鼠', icon: '🐀', desc: '下水道的常客' },
    { name: '毒蛇', icon: '🐍', desc: '剧毒的爬行生物' },
    { name: '野猪', icon: '🐗', desc: '横冲直撞的野兽' },
    { name: '蘑菇怪', icon: '🍄', desc: '会走路的蘑菇' },
    { name: '仙人掌', icon: '🌵', desc: '扎人的沙漠植物' },
    { name: '石头怪', icon: '🪨', desc: '坚硬的岩石生命体' },
    { name: '史莱姆王', icon: '👑', desc: '史莱姆中的王者' },
    { name: '幽灵', icon: '👻', desc: '飘荡的怨念' },
  ],
};

const RARITY_CONFIG = {
  ur:  { stars: '★★★★★★', label: 'UR',  color: '#ff0080' },
  ssr: { stars: '★★★★★',  label: 'SSR', color: '#fbbf24' },
  sr:  { stars: '★★★★',   label: 'SR',  color: '#a855f7' },
  r:   { stars: '★★★',    label: 'R',   color: '#3b82f6' },
  n:   { stars: '★★',     label: 'N',   color: '#6b7280' },
};

// 为每张卡添加稀有度字段
Object.entries(CARDS).forEach(([rarity, list]) => {
  list.forEach(c => c.rarity = rarity);
});

// ============ 游戏状态 ============
const STORAGE_KEY = 'gacha_game_save_v1';
let state = loadState();

function defaultState() {
  return {
    tickets: 100,
    primogems: 16000,
    collection: {}, // { "ur_0": count }
    pity: 0,        // 距离上次 UR 的抽数
    history: [],    // 抽卡历史
    totalPulls: 0,
  };
}

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) return { ...defaultState(), ...JSON.parse(saved) };
  } catch (e) {}
  return defaultState();
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function resetGame() {
  if (confirm('确定要重置所有进度吗？此操作不可撤销。')) {
    state = defaultState();
    saveState();
    updateUI();
    renderCollection();
    renderHistory();
  }
}

// ============ 抽卡逻辑 ============
const RATES = { ur: 0.01, ssr: 0.06, sr: 0.13, r: 0.30, n: 0.50 };
const PITY_THRESHOLD = 80; // 80 抽保底 UR

function rollRarity(forceSrPlus = false) {
  // 保底：达到 80 抽必出 UR
  if (state.pity >= PITY_THRESHOLD - 1) return 'ur';

  const r = Math.random();
  let cumulative = 0;
  for (const [rarity, rate] of Object.entries(RATES)) {
    cumulative += rate;
    if (r < cumulative) {
      // 十连保底：如果是 N/R 且需要 SR+，强制给 SR
      if (forceSrPlus && (rarity === 'n' || rarity === 'r')) {
        return Math.random() < 0.6 ? 'sr' : (Math.random() < 0.7 ? 'ssr' : 'ur');
      }
      return rarity;
    }
  }
  return 'n';
}

function pickCard(rarity) {
  const pool = CARDS[rarity];
  return pool[Math.floor(Math.random() * pool.length)];
}

function getCardKey(rarity, index) {
  return `${rarity}_${index}`;
}

function findCardIndex(rarity, card) {
  return CARDS[rarity].findIndex(c => c.name === card.name);
}

function summon(count) {
  if (state.tickets < count) {
    alert('抽卡券不足！请使用原石购买。');
    return;
  }

  state.tickets -= count;
  state.totalPulls += count;

  const results = [];
  let hasSrPlus = false;

  for (let i = 0; i < count; i++) {
    // 十连最后一抽保底 SR+
    const forceSr = (count === 10 && i === count - 1 && !hasSrPlus);
    const rarity = rollRarity(forceSr);
    const card = pickCard(rarity);
    const cardIdx = findCardIndex(rarity, card);
    const cardKey = getCardKey(rarity, cardIdx);

    const isNew = !state.collection[cardKey];
    state.collection[cardKey] = (state.collection[cardKey] || 0) + 1;

    if (rarity === 'sr' || rarity === 'ssr' || rarity === 'ur') hasSrPlus = true;

    if (rarity === 'ur') {
      state.pity = 0;
    } else {
      state.pity++;
    }

    results.push({ card, rarity, isNew });

    // 记录历史（最多保留 100 条）
    state.history.unshift({
      name: card.name,
      icon: card.icon,
      rarity,
      time: new Date().toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }),
    });
  }
  state.history = state.history.slice(0, 100);

  saveState();
  updateUI();
  showResults(results, count);
}

// ============ UI 更新 ============
function updateUI() {
  document.getElementById('tickets').textContent = state.tickets;
  document.getElementById('primogems').textContent = state.primogems;
  document.getElementById('current-pity').textContent = state.pity;
}

function buyTickets() {
  const cost = 160;
  if (state.primogems < cost) {
    alert('原石不足！');
    return;
  }
  state.primogems -= cost;
  state.tickets += 1;
  saveState();
  updateUI();
}

// ============ 结果展示 ============
function showResults(results, count) {
  const beam = document.getElementById('beam');
  const modal = document.getElementById('result-modal');
  const container = document.getElementById('results-container');

  // 检查最高稀有度决定光效颜色
  const hasUr = results.some(r => r.rarity === 'ur');
  const hasSsr = results.some(r => r.rarity === 'ssr');

  beam.style.display = 'block';
  beam.classList.add('show');
  if (hasUr) {
    beam.style.background = 'radial-gradient(circle, rgba(255,0,128,0.3), transparent 70%)';
  } else if (hasSsr) {
    beam.style.background = 'radial-gradient(circle, rgba(251,191,36,0.3), transparent 70%)';
  } else {
    beam.style.background = 'transparent';
  }

  setTimeout(() => {
    beam.classList.remove('show');
    beam.style.display = 'none';

    container.className = 'results-container ' + (count === 1 ? 'single' : 'ten');
    container.innerHTML = '';

    results.forEach((r, idx) => {
      const card = r.card;
      const cfg = RARITY_CONFIG[r.rarity];
      const div = document.createElement('div');
      div.className = `result-card ${r.rarity}`;
      div.style.animationDelay = (idx * 0.1) + 's';
      div.innerHTML = `
        ${r.isNew ? '<span class="new-badge">NEW</span>' : ''}
        <span class="rarity-label" style="color:${cfg.color}">${cfg.label}</span>
        <div class="icon">${card.icon}</div>
        <div class="name">${card.name}</div>
        <div class="stars" style="color:${cfg.color}">${cfg.stars}</div>
      `;
      container.appendChild(div);
    });

    modal.classList.add('show');
  }, 700);
}

function closeModal() {
  document.getElementById('result-modal').classList.remove('show');
  renderCollection();
  renderHistory();
}

// ============ 图鉴渲染 ============
let currentFilter = 'all';

function renderCollection() {
  const grid = document.getElementById('card-grid');
  grid.innerHTML = '';

  let collected = 0;
  let total = 0;

  const order = ['ur', 'ssr', 'sr', 'r', 'n'];
  order.forEach(rarity => {
    CARDS[rarity].forEach((card, idx) => {
      total++;
      const key = getCardKey(rarity, idx);
      const owned = state.collection[key] || 0;
      if (owned > 0) collected++;

      if (currentFilter !== 'all' && currentFilter !== rarity) return;

      const cfg = RARITY_CONFIG[rarity];
      const div = document.createElement('div');
      div.className = `mini-card rarity-${rarity} ${owned === 0 ? 'locked' : ''}`;
      div.style.background = owned > 0
        ? `linear-gradient(135deg, ${cfg.color}33, ${cfg.color}11)`
        : 'rgba(255,255,255,0.02)';
      div.title = card.desc;
      div.innerHTML = `
        <div class="icon">${owned > 0 ? card.icon : '❓'}</div>
        <div class="name">${owned > 0 ? card.name : '???'}</div>
        ${owned > 1 ? `<span class="count-badge">×${owned}</span>` : ''}
        <div class="rarity-stars" style="color:${cfg.color}">${cfg.stars}</div>
      `;
      grid.appendChild(div);
    });
  });

  document.getElementById('collected-count').textContent = collected;
  document.getElementById('total-count').textContent = total;
}

// ============ 历史记录 ============
function renderHistory() {
  const list = document.getElementById('history-list');
  if (state.history.length === 0) {
    list.innerHTML = '<div class="empty-state">还没有抽卡记录，快去试试手气吧！</div>';
    return;
  }
  list.innerHTML = state.history.map(h => {
    const cfg = RARITY_CONFIG[h.rarity];
    return `
      <div class="history-item" style="border-left-color:${cfg.color}">
        <span class="h-icon">${h.icon}</span>
        <span class="h-name">${h.name}</span>
        <span class="h-rarity" style="background:${cfg.color}33;color:${cfg.color}">${cfg.label}</span>
        <span class="h-time">${h.time}</span>
      </div>
    `;
  }).join('');
}

// ============ 标签切换 ============
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    const name = tab.dataset.tab;
    document.getElementById('tab-collection').style.display = name === 'collection' ? '' : 'none';
    document.getElementById('tab-history').style.display = name === 'history' ? '' : 'none';
  });
});

// ============ 筛选 ============
document.querySelectorAll('.filter-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    currentFilter = chip.dataset.filter;
    renderCollection();
  });
});

// ============ 背景粒子 ============
function createParticles() {
  for (let i = 0; i < 30; i++) {
    const p = document.createElement('div');
    p.className = 'particle';
    p.style.left = Math.random() * 100 + '%';
    p.style.animationDuration = (8 + Math.random() * 12) + 's';
    p.style.animationDelay = Math.random() * 10 + 's';
    p.style.opacity = 0.3 + Math.random() * 0.5;
    document.body.appendChild(p);
  }
}

// ============ 初始化 ============
updateUI();
renderCollection();
renderHistory();
createParticles();

// 点击弹窗外部关闭
document.getElementById('result-modal').addEventListener('click', (e) => {
  if (e.target.id === 'result-modal') closeModal();
});
</script>
