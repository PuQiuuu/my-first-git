<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>幻域抽卡 · Gacha Game</title>
<style>
  /* ============ 黑白简笔画风格 ============ */
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --ink: #000;
    --paper: #fff;
    --line: #000;
    --muted: #666;
    --light: #f5f5f5;
    --dash: 4px;
  }

  body {
    font-family: "Comic Sans MS", "Marker Felt", "PingFang SC", "Microsoft YaHei", cursive, sans-serif;
    background: var(--paper);
    color: var(--ink);
    min-height: 100vh;
    background-image:
      linear-gradient(var(--line) 1px, transparent 1px),
      linear-gradient(90deg, var(--line) 1px, transparent 1px);
    background-size: 40px 40px;
    background-position: -1px -1px;
    background-color: #fafafa;
  }

  /* 顶部状态栏 */
  .topbar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 24px;
    background: var(--paper);
    border-bottom: 3px solid var(--line);
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .logo {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: 2px;
  }
  .logo::before { content: "✎ "; }

  .stats { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
  .stat-item {
    display: flex; align-items: center; gap: 6px;
    border: 2px solid var(--line);
    padding: 6px 14px;
    border-radius: 20px;
    font-size: 14px;
    background: var(--paper);
  }
  .stat-icon { font-size: 16px; }
  .stat-value { font-weight: 700; }

  .btn-reset {
    background: var(--paper);
    border: 2px dashed var(--line);
    color: var(--ink);
    padding: 6px 14px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-family: inherit;
    transition: background 0.15s;
  }
  .btn-reset:hover { background: var(--light); }

  /* 主区域 */
  .container {
    max-width: 1100px;
    margin: 0 auto;
    padding: 24px;
  }

  .hero {
    text-align: center;
    padding: 30px 20px 10px;
  }
  .hero h1 {
    font-size: 34px;
    margin-bottom: 6px;
    font-weight: 800;
    letter-spacing: 1px;
  }
  .hero h1::after {
    content: "";
    display: block;
    width: 120px;
    height: 3px;
    background: var(--line);
    margin: 10px auto 0;
    border-radius: 2px;
  }
  .hero p { color: var(--muted); font-size: 15px; }

  /* 概率展示 */
  .rate-bar {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin: 20px 0;
    flex-wrap: wrap;
  }
  .rate-pill {
    padding: 6px 14px;
    border: 2px solid var(--line);
    border-radius: 14px;
    font-size: 12px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--paper);
  }
  .rate-ur { border-style: double; border-width: 4px; }
  .rate-ssr { border-width: 3px; }
  .rate-sr { border-width: 2px; }
  .rate-r { border-style: dashed; }
  .rate-n { border-style: dotted; opacity: 0.7; }

  /* 抽卡按钮区 */
  .summon-area {
    display: flex;
    justify-content: center;
    gap: 16px;
    margin: 30px 0;
    flex-wrap: wrap;
  }
  .summon-btn {
    padding: 16px 36px;
    border: 3px solid var(--line);
    border-radius: 14px;
    font-size: 17px;
    font-weight: 700;
    cursor: pointer;
    color: var(--ink);
    background: var(--paper);
    font-family: inherit;
    position: relative;
    transition: transform 0.1s, background 0.15s;
  }
  .summon-btn:hover { transform: translate(-2px, -2px); box-shadow: 4px 4px 0 var(--line); }
  .summon-btn:active { transform: translate(0, 0); box-shadow: none; }
  .summon-btn:disabled { opacity: 0.4; cursor: not-allowed; box-shadow: none; transform: none; }

  .btn-single { border-style: solid; }
  .btn-ten { border-style: double; border-width: 5px; }
  .summon-btn .cost {
    display: block;
    font-size: 11px;
    font-weight: 400;
    color: var(--muted);
    margin-top: 4px;
  }

  .guarantee-info {
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    margin-bottom: 20px;
  }
  .guarantee-info span { font-weight: 700; color: var(--ink); text-decoration: underline; }

  /* 标签页 */
  .tabs {
    display: flex;
    gap: 8px;
    justify-content: center;
    margin-bottom: 20px;
  }
  .tab {
    padding: 8px 22px;
    background: var(--paper);
    border: 2px solid var(--line);
    border-radius: 10px;
    cursor: pointer;
    font-size: 14px;
    color: var(--muted);
    font-family: inherit;
    transition: all 0.15s;
  }
  .tab.active {
    background: var(--ink);
    color: var(--paper);
  }
  .tab:hover:not(.active) { background: var(--light); }

  /* 图鉴区 */
  .collection {
    background: var(--paper);
    border: 3px solid var(--line);
    border-radius: 16px;
    padding: 22px;
  }
  .collection-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 2px dashed var(--line);
  }
  .collection-header h2 { font-size: 18px; }
  .collection-count { color: var(--muted); font-size: 13px; }
  .collection-count b { color: var(--ink); font-weight: 700; }

  .filter-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .filter-chip {
    padding: 5px 14px;
    border-radius: 14px;
    font-size: 12px;
    cursor: pointer;
    background: var(--paper);
    border: 2px solid var(--line);
    color: var(--muted);
    font-family: inherit;
    font-weight: 600;
  }
  .filter-chip.active { background: var(--ink); color: var(--paper); }

  .card-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 12px;
  }
  .mini-card {
    aspect-ratio: 3/4;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 8px;
    position: relative;
    overflow: hidden;
    border: 2px solid var(--line);
    background: var(--paper);
    transition: transform 0.15s;
    cursor: pointer;
  }
  .mini-card:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--line); }
  .mini-card.locked {
    opacity: 0.35;
    border-style: dashed;
  }
  .mini-card .icon { font-size: 30px; margin-bottom: 6px; filter: grayscale(1); }
  .mini-card .name { font-size: 12px; font-weight: 700; text-align: center; }
  .mini-card .count-badge {
    position: absolute;
    top: 4px;
    right: 4px;
    background: var(--ink);
    color: var(--paper);
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 8px;
    font-weight: 700;
  }
  .mini-card .rarity-stars {
    position: absolute;
    bottom: 4px;
    font-size: 10px;
    letter-spacing: 1px;
  }
  /* 稀有度用边框样式区分 */
  .mini-card.rarity-ur { border: 4px double var(--line); }
  .mini-card.rarity-ssr { border: 3px solid var(--line); }
  .mini-card.rarity-sr { border: 2px solid var(--line); }
  .mini-card.rarity-r { border: 2px dashed var(--line); }
  .mini-card.rarity-n { border: 1px dotted var(--line); }

  /* 抽卡结果弹窗 */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(255,255,255,0.9);
    backdrop-filter: blur(4px);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    padding: 20px;
  }
  .modal-overlay.show { display: flex; }

  .results-container {
    display: grid;
    gap: 14px;
    width: 100%;
    max-width: 900px;
  }
  .results-container.single {
    grid-template-columns: 1fr;
    max-width: 260px;
  }
  .results-container.ten {
    grid-template-columns: repeat(5, 1fr);
  }
  @media (max-width: 700px) {
    .results-container.ten { grid-template-columns: repeat(2, 1fr); }
  }

  .result-card {
    aspect-ratio: 3/4;
    border-radius: 12px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 12px;
    position: relative;
    overflow: hidden;
    border: 3px solid var(--line);
    background: var(--paper);
    transform: scale(0) rotateY(180deg);
    animation: cardReveal 0.5s forwards;
  }
  @keyframes cardReveal {
    0% { transform: scale(0) rotateY(180deg); }
    60% { transform: scale(1.08) rotateY(0); }
    100% { transform: scale(1) rotateY(0); }
  }
  .result-card .icon { font-size: 46px; margin-bottom: 8px; filter: grayscale(1); }
  .result-card .name { font-size: 13px; font-weight: 700; text-align: center; }
  .result-card .stars { font-size: 12px; margin-top: 4px; }
  .result-card .rarity-label {
    position: absolute;
    top: 6px;
    left: 6px;
    font-size: 10px;
    font-weight: 800;
    padding: 2px 8px;
    border-radius: 6px;
    border: 1px solid var(--line);
    background: var(--paper);
  }

  /* 稀有度用边框/背景区分 */
  .result-card.ur { border: 5px double var(--line); background: var(--light); }
  .result-card.ssr { border: 4px solid var(--line); }
  .result-card.sr { border: 3px solid var(--line); }
  .result-card.r { border: 2px dashed var(--line); }
  .result-card.n { border: 1px dotted var(--line); opacity: 0.8; }

  /* 单抽大卡特殊样式 */
  .results-container.single .result-card { padding: 22px; }
  .results-container.single .result-card .icon { font-size: 76px; }
  .results-container.single .result-card .name { font-size: 18px; }
  .results-container.single .result-card .stars { font-size: 15px; }

  /* 抽卡光束动画 - 黑白版本 */
  .beam {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 999;
    display: none;
  }
  .beam.show { display: block; }
  .beam::before {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 10px; height: 10px;
    border-radius: 50%;
    background: var(--ink);
    box-shadow: 0 0 50px 30px rgba(0,0,0,0.5);
    animation: beamExpand 0.7s ease-out;
  }
  @keyframes beamExpand {
    0% { transform: translate(-50%,-50%) scale(0); opacity: 1; }
    100% { transform: translate(-50%,-50%) scale(60); opacity: 0; }
  }

  .modal-close {
    margin-top: 20px;
    padding: 10px 40px;
    background: var(--ink);
    border: 3px solid var(--line);
    color: var(--paper);
    border-radius: 10px;
    cursor: pointer;
    font-size: 15px;
    font-weight: 700;
    font-family: inherit;
    align-self: center;
    transition: transform 0.1s;
  }
  .modal-close:hover { transform: translate(-1px, -1px); box-shadow: 3px 3px 0 var(--line); }

  /* 获得新卡提示 */
  .new-badge {
    position: absolute;
    top: -4px; right: -4px;
    background: var(--ink);
    color: var(--paper);
    font-size: 10px;
    font-weight: 700;
    padding: 2px 6px;
    border-radius: 8px;
    z-index: 10;
    border: 1px solid var(--line);
  }

  /* 模态框内容布局 */
  .modal-inner {
    display: flex;
    flex-direction: column;
    align-items: center;
    width: 100%;
  }

  /* 历史记录 */
  .history {
    background: var(--paper);
    border: 3px solid var(--line);
    border-radius: 16px;
    padding: 22px;
  }
  .history h2 { font-size: 18px; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 2px dashed var(--line); }
  .history-list {
    max-height: 400px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .history-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 10px 14px;
    background: var(--paper);
    border-radius: 8px;
    border: 2px solid var(--line);
    border-left-width: 6px;
  }
  .history-item .h-icon { font-size: 22px; filter: grayscale(1); }
  .history-item .h-name { flex: 1; font-size: 14px; font-weight: 600; }
  .history-item .h-time { color: var(--muted); font-size: 12px; }
  .history-item .h-rarity {
    font-size: 11px;
    font-weight: 700;
    padding: 2px 8px;
    border-radius: 6px;
    border: 1px solid var(--line);
  }

  .empty-state {
    text-align: center;
    color: var(--muted);
    padding: 40px 20px;
    font-size: 14px;
  }

  /* 滚动条 */
  ::-webkit-scrollbar { width: 10px; }
  ::-webkit-scrollbar-track { background: var(--light); }
  ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 5px; border: 2px solid var(--light); }
</style>
</head>
<body>

<div class="topbar">
  <div class="logo">幻域抽卡</div>
  <div class="stats">
    <div class="stat-item">
      <span class="stat-icon">🎫</span>
      <span>抽卡券</span>
      <span class="stat-value" id="tickets">100</span>
    </div>
    <div class="stat-item">
      <span class="stat-icon">💎</span>
      <span>原石</span>
      <span class="stat-value" id="primogems">16000</span>
    </div>
    <button class="btn-reset" onclick="resetGame()">重置存档</button>
  </div>
</div>

<div class="container">
  <div class="hero">
    <h1>召唤你的命运</h1>
    <p>在幻域中寻找属于你的传奇角色</p>
  </div>

  <div class="rate-bar">
    <div class="rate-pill rate-ur">UR 1%</div>
    <div class="rate-pill rate-ssr">SSR 6%</div>
    <div class="rate-pill rate-sr">SR 13%</div>
    <div class="rate-pill rate-r">R 30%</div>
    <div class="rate-pill rate-n">N 50%</div>
  </div>

  <div class="guarantee-info">
    十连必出 <span>SR</span> 及以上 · 每 <span id="pity-count">80</span> 抽保底 <span>UR</span>
    （当前已累计 <span id="current-pity">0</span> 抽未出 UR）
  </div>

  <div class="summon-area">
    <button class="summon-btn btn-single" onclick="summon(1)">
      单抽
      <span class="cost">消耗 1 张抽卡券</span>
    </button>
    <button class="summon-btn btn-ten" onclick="summon(10)">
      十连抽
      <span class="cost">消耗 10 张抽卡券 · 保底 SR+</span>
    </button>
    <button class="summon-btn" onclick="buyTickets()">
      购买抽卡券
      <span class="cost">160 原石 = 1 张</span>
    </button>
  </div>

  <div class="tabs">
    <div class="tab active" data-tab="collection">📚 图鉴</div>
    <div class="tab" data-tab="history">📜 抽卡记录</div>
  </div>

  <!-- 图鉴 -->
  <div class="tab-content" id="tab-collection">
    <div class="collection">
      <div class="collection-header">
        <h2>角色图鉴</h2>
        <div class="collection-count">已收集 <b id="collected-count">0</b> / <span id="total-count">0</span></div>
      </div>
      <div class="filter-bar">
        <div class="filter-chip active" data-filter="all">全部</div>
        <div class="filter-chip" data-filter="ur">UR</div>
        <div class="filter-chip" data-filter="ssr">SSR</div>
        <div class="filter-chip" data-filter="sr">SR</div>
        <div class="filter-chip" data-filter="r">R</div>
        <div class="filter-chip" data-filter="n">N</div>
      </div>
      <div class="card-grid" id="card-grid"></div>
    </div>
  </div>

  <!-- 历史 -->
  <div class="tab-content" id="tab-history" style="display:none;">
    <div class="history">
      <h2>抽卡记录</h2>
      <div class="history-list" id="history-list"></div>
    </div>
  </div>
</div>

<!-- 抽卡光束 -->
<div class="beam" id="beam"></div>

<!-- 结果弹窗 -->
<div class="modal-overlay" id="result-modal">
  <div class="modal-inner">
    <div class="results-container" id="results-container"></div>
    <button class="modal-close" onclick="closeModal()">确认</button>
  </div>
</div>

    { name: '僵尸', icon: '🧟', desc: '行动迟缓的不死者' },
    { name: '老鼠', icon: '🐀', desc: '下水道的常客' },
    { name: '毒蛇', icon: '🐍', desc: '剧毒的爬行生物' },
    { name: '野猪', icon: '🐗', desc: '横冲直撞的野兽' },
    { name: '蘑菇怪', icon: '🍄', desc: '会走路的蘑菇' },
    { name: '仙人掌', icon: '🌵', desc: '扎人的沙漠植物' },
    { name: '石头怪', icon: '🪨', desc: '坚硬的岩石生命体' },
    { name: '史莱姆王', icon: '👑', desc: '史莱姆中的王者' },
    { name: '幽灵', icon: '👻', desc: '飘荡的怨念' },
  ],
};

const RARITY_CONFIG = {
  ur:  { stars: '★★★★★★', label: 'UR' },
  ssr: { stars: '★★★★★',  label: 'SSR' },
  sr:  { stars: '★★★★',   label: 'SR' },
  r:   { stars: '★★★',    label: 'R' },
  n:   { stars: '★★',     label: 'N' },
};

// 为每张卡添加稀有度字段
Object.entries(CARDS).forEach(([rarity, list]) => {
  list.forEach(c => c.rarity = rarity);
});

// ============ 游戏状态 ============
const STORAGE_KEY = 'gacha_game_save_v1';
let state = loadState();

function defaultState() {
  return {
    tickets: 100,
    primogems: 16000,
    collection: {},
    pity: 0,
    history: [],
    totalPulls: 0,
  };
}

function loadState() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) return { ...defaultState(), ...JSON.parse(saved) };
  } catch (e) {}
  return defaultState();
}

function saveState() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
}

function resetGame() {
  if (confirm('确定要重置所有进度吗？此操作不可撤销。')) {
    state = defaultState();
    saveState();
    updateUI();
    renderCollection();
    renderHistory();
  }
}

// ============ 抽卡逻辑 ============
const RATES = { ur: 0.01, ssr: 0.06, sr: 0.13, r: 0.30, n: 0.50 };
const PITY_THRESHOLD = 80;

function rollRarity(forceSrPlus = false) {
  if (state.pity >= PITY_THRESHOLD - 1) return 'ur';

  const r = Math.random();
  let cumulative = 0;
  for (const [rarity, rate] of Object.entries(RATES)) {
    cumulative += rate;
    if (r < cumulative) {
      if (forceSrPlus && (rarity === 'n' || rarity === 'r')) {
        return Math.random() < 0.6 ? 'sr' : (Math.random() < 0.7 ? 'ssr' : 'ur');
      }
      return rarity;
    }
  }
  return 'n';
}

function pickCard(rarity) {
  const pool = CARDS[rarity];
  return pool[Math.floor(Math.random() * pool.length)];
}

function getCardKey(rarity, index) {
  return `${rarity}_${index}`;
}

function findCardIndex(rarity, card) {
  return CARDS[rarity].findIndex(c => c.name === card.name);
}

function summon(count) {
  if (state.tickets < count) {
    alert('抽卡券不足！请使用原石购买。');
    return;
  }

  state.tickets -= count;
  state.totalPulls += count;

  const results = [];
  let hasSrPlus = false;

  for (let i = 0; i < count; i++) {
    const forceSr = (count === 10 && i === count - 1 && !hasSrPlus);
    const rarity = rollRarity(forceSr);
    const card = pickCard(rarity);
    const cardIdx = findCardIndex(rarity, card);
    const cardKey = getCardKey(rarity, cardIdx);

    const isNew = !state.collection[cardKey];
    state.collection[cardKey] = (state.collection[cardKey] || 0) + 1;

    if (rarity === 'sr' || rarity === 'ssr' || rarity === 'ur') hasSrPlus = true;

    if (rarity === 'ur') {
      state.pity = 0;
    } else {
      state.pity++;
    }

    results.push({ card, rarity, isNew });

    state.history.unshift({
      name: card.name,
      icon: card.icon,
      rarity,
      time: new Date().toLocaleString('zh-CN', { month: '2-digit', day: '2-digit', hour: '2-digit', minute: '2-digit' }),
    });
  }
  state.history = state.history.slice(0, 100);

  saveState();
  updateUI();
  showResults(results, count);
}

// ============ UI 更新 ============
function updateUI() {
  document.getElementById('tickets').textContent = state.tickets;
  document.getElementById('primogems').textContent = state.primogems;
  document.getElementById('current-pity').textContent = state.pity;
}

function buyTickets() {
  const cost = 160;
  if (state.primogems < cost) {
    alert('原石不足！');
    return;
  }
  state.primogems -= cost;
  state.tickets += 1;
  saveState();
  updateUI();
}

// ============ 结果展示 ============
function showResults(results, count) {
  const beam = document.getElementById('beam');
  const modal = document.getElementById('result-modal');
  const container = document.getElementById('results-container');

  const hasUr = results.some(r => r.rarity === 'ur');
  const hasSsr = results.some(r => r.rarity === 'ssr');

  beam.style.display = 'block';
  beam.classList.add('show');
  if (hasUr || hasSsr) {
    beam.style.background = 'radial-gradient(circle, rgba(0,0,0,0.15), transparent 70%)';
  } else {
    beam.style.background = 'transparent';
  }

  setTimeout(() => {
    beam.classList.remove('show');
    beam.style.display = 'none';

    container.className = 'results-container ' + (count === 1 ? 'single' : 'ten');
    container.innerHTML = '';

    results.forEach((r, idx) => {
      const card = r.card;
      const cfg = RARITY_CONFIG[r.rarity];
      const div = document.createElement('div');
      div.className = `result-card ${r.rarity}`;
      div.style.animationDelay = (idx * 0.1) + 's';
      div.innerHTML = `
        ${r.isNew ? '<span class="new-badge">NEW</span>' : ''}
        <span class="rarity-label">${cfg.label}</span>
        <div class="icon">${card.icon}</div>
        <div class="name">${card.name}</div>
        <div class="stars">${cfg.stars}</div>
      `;
      container.appendChild(div);
    });

    modal.classList.add('show');
  }, 650);
}

function closeModal() {
  document.getElementById('result-modal').classList.remove('show');
  renderCollection();
  renderHistory();
}

// ============ 图鉴渲染 ============
let currentFilter = 'all';

function renderCollection() {
  const grid = document.getElementById('card-grid');
  grid.innerHTML = '';

  let collected = 0;
  let total = 0;

  const order = ['ur', 'ssr', 'sr', 'r', 'n'];
  order.forEach(rarity => {
    CARDS[rarity].forEach((card, idx) => {
      total++;
      const key = getCardKey(rarity, idx);
      const owned = state.collection[key] || 0;
      if (owned > 0) collected++;

      if (currentFilter !== 'all' && currentFilter !== rarity) return;

      const cfg = RARITY_CONFIG[rarity];
      const div = document.createElement('div');
      div.className = `mini-card rarity-${rarity} ${owned === 0 ? 'locked' : ''}`;
      div.title = card.desc;
      div.innerHTML = `
        <div class="icon">${owned > 0 ? card.icon : '？'}</div>
        <div class="name">${owned > 0 ? card.name : '???'}</div>
        ${owned > 1 ? `<span class="count-badge">×${owned}</span>` : ''}
        <div class="rarity-stars">${cfg.stars}</div>
      `;
      grid.appendChild(div);
    });
  });

  document.getElementById('collected-count').textContent = collected;
  document.getElementById('total-count').textContent = total;
}

// ============ 历史记录 ============
function renderHistory() {
  const list = document.getElementById('history-list');
  if (state.history.length === 0) {
    list.innerHTML = '<div class="empty-state">还没有抽卡记录，快去试试手气吧！</div>';
    return;
  }
  list.innerHTML = state.history.map(h => {
    const cfg = RARITY_CONFIG[h.rarity];
    return `
      <div class="history-item">
        <span class="h-icon">${h.icon}</span>
        <span class="h-name">${h.name}</span>
        <span class="h-rarity">${cfg.label}</span>
        <span class="h-time">${h.time}</span>
      </div>
    `;
  }).join('');
}

// ============ 标签切换 ============
document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    const name = tab.dataset.tab;
    document.getElementById('tab-collection').style.display = name === 'collection' ? '' : 'none';
    document.getElementById('tab-history').style.display = name === 'history' ? '' : 'none';
  });
});

// ============ 筛选 ============
document.querySelectorAll('.filter-chip').forEach(chip => {
  chip.addEventListener('click', () => {
    document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
    chip.classList.add('active');
    currentFilter = chip.dataset.filter;
    renderCollection();
  });
});

// ============ 初始化 ============
updateUI();
renderCollection();
renderHistory();

// 点击弹窗外部关闭
document.getElementById('result-modal').addEventListener('click', (e) => {
  if (e.target.id === 'result-modal') closeModal();
});
</script>
